<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>章域·视频混剪智能体</title>
  <link rel="icon" type="image/png" href="./assets/zhangyu-video-agent-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./remake.css">
  <link rel="stylesheet" href="./subtitle.css">
  <link rel="stylesheet" href="./annotations.css?v=folder-input-20260921">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="./assets/zhangyu-video-agent-icon.png" alt="章域·视频混剪智能体"><span>章域·视频混剪智能体</span></div>
      <div class="runtime"><span id="serviceStatus">本地服务启动中</span><button id="exportDiagnostics" class="icon-button" type="button" title="导出诊断日志，不包含素材文件和密钥">导出诊断日志</button><button id="openLogs" class="icon-button" type="button" title="查看运行目录">运行目录</button></div>
    </header>
    <div class="studio-shell">
      <aside class="sidebar"><h2>功能选择</h2><nav id="navigation"></nav></aside>
      <main id="workspace" class="workspace" aria-live="polite"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="mediaViewer" class="media-viewer" aria-labelledby="mediaViewerTitle">
    <header>
      <span><small>素材预览</small><strong id="mediaViewerTitle"></strong></span>
      <button type="button" class="media-viewer__close" data-preview-close aria-label="关闭预览">×</button>
    </header>
    <div id="mediaViewerBody" class="media-viewer__body"></div>
  </dialog>
  <script type="module" src="./app.js?v=folder-input-20260921"></script>
